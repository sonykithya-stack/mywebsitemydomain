<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Wage Table</title>
  <link rel="stylesheet" href="">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    table {
      width: 90%;
      max-width: 1100px;
      border-collapse: collapse;
      text-align: center;
    }

    th, td {
      border: 5px solid #ff8800;
      padding: 24px 20px;
    }

    th {
      background-color: #e9e9e9;
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }

    td {
      background-color: #f5f5f5;
      font-size: 22px;
      color: #555;
    }

    .wage {
      color: #ff8800;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>NAME</th>
      <th>POSITION</th>
      <th>WAGE</th>
    </tr>

    <tr>
      <td>Emma Johnson</td>
      <td>Sales Associate</td>
      <td class="wage">$15.50 per hour</td>
    </tr>

    <tr>
      <td>Liam Thompson</td>
      <td>Customer Service Representative</td>
      <td class="wage">$14.75 per hour</td>
    </tr>

    <tr>
      <td>Olivia Rodriguez</td>
      <td>Marketing Coordinator</td>
      <td class="wage">$18.25 per hour</td>
    </tr>

    <tr>
      <td>Noah Smith</td>
      <td>IT Support Specialist</td>
      <td class="wage">$20.00 per hour</td>
    </tr>

    <tr>
      <td>Ava Davis</td>
      <td>Administrative Assistant</td>
      <td class="wage">$16.80 per hour</td>
    </tr>
  </table>

</body>
</html>
